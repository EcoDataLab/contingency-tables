name: Linux formal verification
run-name: Linux ${{ inputs.scope || (startsWith(github.ref, 'refs/tags/verify-integration-') && 'integration-sampler') || 'focused' }} verification at ${{ github.sha }}

# Explicit dispatch or verification tags only: the closure is expensive.
# Comparator starts in a fresh job without previously compiled submitted proofs.
on:
  push:
    tags:
      - 'verify-*'
  workflow_dispatch:
    inputs:
      scope:
        description: 'focused: baseline plus current chain/program; integration-sampler: same main verification; full: original build; comparator: strict replay'
        type: choice
        required: true
        default: focused
        options:
          - focused
          - integration-sampler
          - full
          - comparator
      build_mode:
        description: 'Ordinary Lean build mode; Comparator keeps its separate strict flow'
        type: choice
        required: true
        default: '--serial'
        options:
          - '--serial'
          - parallel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      VERIFY_SCOPE: ${{ inputs.scope || (startsWith(github.ref, 'refs/tags/verify-integration-') && 'integration-sampler') || 'focused' }}
      VERIFY_MODE: ${{ inputs.build_mode || '--serial' }}
      VERIFICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the selected commit without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Record the fresh environment and exact source inputs
        id: environment
        run: |
          set -euo pipefail
          case "$VERIFY_SCOPE" in focused|integration-sampler|full|comparator) ;; *) exit 2 ;; esac
          case "$VERIFY_MODE" in --serial|parallel) ;; *) exit 2 ;; esac
          test "$(id -u)" -ne 0
          test ! -d formal/.lake
          mkdir -p .tools/linux-verification
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, platform, subprocess
          root = pathlib.Path.cwd()
          files = [root / p for p in ["formal/lakefile.lean", "formal/lake-manifest.json", "formal/lean-toolchain",
                   "formal/default-audit-contract.json", "claims.json", "scripts/prepare_environment_audit.py",
                   "scripts/run_environment_audit.py"]]
          files += sorted((root / "formal").rglob("*.lean"))
          if os.environ["VERIFY_SCOPE"] in {"focused", "integration-sampler"}:
              manifest = root / "research/repair-accept/integration-sampler.json"
              files += [manifest, root / "research/repair-accept/verify.py",
                        root / "scripts/build_lean_serial.py", root / "scripts/verify_main.sh"]
              files += [root / p for p in json.loads(manifest.read_text())["sources"].values()
                        if (root / p).is_file()]
          record = {
              "started_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "repository_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "scope": os.environ["VERIFY_SCOPE"], "run_url": os.environ["VERIFICATION_RUN_URL"],
              "ordinary_build_mode": None if os.environ["VERIFY_SCOPE"] == "comparator" else os.environ["VERIFY_MODE"],
              "runner_label": "ubuntu-24.04", "kernel": platform.release(), "machine": platform.machine(),
              "image_version": os.environ.get("ImageVersion"), "uid": os.getuid(),
              "mathlib_cache": "official upstream cache trusted; no cross-job proof artifacts restored",
              "memory_kib": {line.split(":")[0]: int(line.split()[1])
                  for line in pathlib.Path("/proc/meminfo").read_text().splitlines()
                  if line.split(":")[0] in {"MemTotal", "MemAvailable", "SwapTotal", "SwapFree"}},
              "source_sha256": {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
          }
          pathlib.Path(".tools/linux-verification/environment.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, indent=2))
          PY
          df -h .

      - name: Require the actual strict Linux sandbox before downloading proof dependencies
        id: sandbox
        if: inputs.scope == 'comparator'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          scripts/bootstrap_comparator.sh preflight 2>&1 | tee .tools/linux-verification/sandbox-preflight.log

      - name: Install the pinned Lean toolchain and trusted Mathlib cache locally
        id: bootstrap
        timeout-minutes: 40
        run: |
          set -euo pipefail
          scripts/bootstrap_lean.sh 2>&1 | tee .tools/linux-verification/bootstrap-lean.log
          git diff --exit-code -- formal/lakefile.lean formal/lake-manifest.json formal/lean-toolchain

      - name: Build the pinned Comparator, exporter, and strict Landrun adapter
        id: comparator_tools
        if: inputs.scope == 'comparator'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          scripts/bootstrap_comparator.sh bootstrap 2>&1 | tee .tools/linux-verification/bootstrap-comparator.log

      - name: Run the selected verification scope
        id: verification
        timeout-minutes: 280
        run: |
          set -euo pipefail
          # Leave time within the six-hour job limit to upload failure evidence.
          if [[ "$VERIFY_SCOPE" == comparator ]]; then
            timeout --signal=TERM --kill-after=60s 270m scripts/bootstrap_comparator.sh verify \
              2>&1 | tee .tools/linux-verification/verification.log
          elif [[ "$VERIFY_SCOPE" == focused || "$VERIFY_SCOPE" == integration-sampler ]]; then
            timeout --signal=TERM --kill-after=60s 270m bash scripts/verify_main.sh \
              "$VERIFY_MODE" .local/main-lean-linux \
              2>&1 | tee .tools/linux-verification/verification.log
          else
            timeout --signal=TERM --kill-after=60s 270m scripts/verify_lean.sh "$VERIFY_SCOPE" "$VERIFY_MODE" \
              2>&1 | tee .tools/linux-verification/verification.log
          fi
          git diff --exit-code -- formal/lakefile.lean formal/lake-manifest.json formal/lean-toolchain

      - name: Record the outcome without upgrading the verification claim
        if: always()
        env:
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          SANDBOX_OUTCOME: ${{ steps.sandbox.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          TOOLS_OUTCOME: ${{ steps.comparator_tools.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
        run: |
          mkdir -p .tools/linux-verification
          python3 - <<'PY'
          import datetime, json, os, pathlib
          scope = os.environ["VERIFY_SCOPE"]
          steps = {key: os.environ[key] for key in (
              "ENVIRONMENT_OUTCOME", "SANDBOX_OUTCOME", "BOOTSTRAP_OUTCOME", "TOOLS_OUTCOME", "VERIFICATION_OUTCOME")}
          passed = steps["VERIFICATION_OUTCOME"] == "success"
          if scope == "comparator":
              passed = passed and all(steps[key] == "success" for key in steps)
          claim = {
              "focused": "Fresh focused baseline plus public research-source compilation, including d8/aspect-dependent squared bounds and the complete program contract, with selected endpoint/dependency-closure audit; trusted bootstrap, no Comparator or new runtime claim.",
              "integration-sampler": "Main ordinary verification: fresh focused baseline plus current public chain/program sources and selected audits; trusted bootstrap, no Comparator or new runtime claim.",
              "full": "Original theorem-closure Lean compilation and printed-axiom audit only; no Comparator replay.",
              "comparator": "Original three theorems: strict sandboxed Comparator built-in-kernel replay; Nanoda disabled.",
          }[scope] if passed else "No successful verification claim for this run; inspect the failing step."
          result = {"scope": scope, "passed": passed, "claim": claim, "step_outcomes": steps,
                    "finished_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    "run_url": os.environ["VERIFICATION_RUN_URL"]}
          pathlib.Path(".tools/linux-verification/outcome.json").write_text(json.dumps(result, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(f"**{scope}: {'passed' if passed else 'not verified'}**\n\n{claim}\n\n")
              stream.write("Fresh job; project and dependency source pins retained. Official Mathlib cache is trusted.\n")
          print(json.dumps(result, indent=2))
          PY

      - name: Preserve logs and provenance even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: math115-linux-${{ env.VERIFY_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tools/linux-verification/
            .local/environment-audits/
            .local/integration-sampler-linux/*.json
            .local/integration-sampler-linux/*.json.gz
            .local/integration-sampler-linux/*.lean
            .local/integration-sampler-linux/*.stdout.txt
            .local/integration-sampler-linux/*.stderr.txt
            .local/main-lean-linux/*.json
            .local/main-lean-linux/*.log
            .local/main-lean-linux/integration/*.json
            .local/main-lean-linux/integration/*.json.gz
            .local/main-lean-linux/integration/*.lean
            .local/main-lean-linux/integration/*.stdout.txt
            .local/main-lean-linux/integration/*.stderr.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
