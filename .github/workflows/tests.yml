name: Reproduce checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  exact-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[research]'
      - run: python -m unittest discover -s tests -v
      - run: python 115/audit115.py --output /tmp/audit115-rerun.json
      - run: python scripts/verify_sources.py --bundle-only
      - run: python experiments/independent_crosscheck.py --output /tmp/independent-crosscheck.json
      - run: PYTHONPATH=src python -S experiments/cycle_mixtures.py --replay reports/cycle-mixtures.json
      - run: python examples/sparse_commute.py --output /tmp/sparse-commute.json
      - run: python examples/linear_metric_bounds.py --output /tmp/linear-bounds.json
