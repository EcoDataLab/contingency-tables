name: Reproduce checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  exact-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[research]'
      - name: Install the optional worker-law backend on one lane
        if: matrix.python-version == '3.12'
        run: python -m pip install scipy
      - name: Run the exact Python tests
        run: make PYTHON=python test
      - name: Check the saved claims and README summary
        run: make PYTHON=python claims-check
      - name: Replay the original finite audit
        run: make PYTHON=python REPORT_DIR=/tmp audit
      - name: Verify the preserved source bundle
        run: make PYTHON=python sources-bundle
      - name: Run the independent finite crosscheck
        run: make PYTHON=python REPORT_DIR=/tmp crosscheck
      - name: Replay the exact mixture certificates without site packages
        run: make PYTHON=python replay-mixtures
      - name: Run the sparse commuting example
        run: make PYTHON=python REPORT_DIR=/tmp sparse-example
      - name: Run the exact linear bounds example
        run: make PYTHON=python REPORT_DIR=/tmp linear-example
