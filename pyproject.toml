[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contingency115"
version = "0.1.0"
description = "Reproducible research and exact reference algorithms for constrained contingency tables"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "EcoDataLab contributors"}]
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/EcoDataLab/contingency-tables"
Issues = "https://github.com/EcoDataLab/contingency-tables/issues"

[tool.setuptools.packages.find]
where = ["src"]

